services:
  - type: web
    runtime: node
    name: ft-campaigner-api-fra
    region: frankfurt
    plan: starter
    rootDir: .
    autoDeployTrigger: commit
    healthCheckPath: /v1/health
    buildCommand: npx --yes pnpm@10.18.3 install --frozen-lockfile --prod=false && npx --yes pnpm@10.18.3 prisma:generate && npx --yes pnpm@10.18.3 --filter @fliptrybe/api build
    preDeployCommand: npx --yes pnpm@10.18.3 --filter @fliptrybe/database prisma migrate deploy
    startCommand: npx --yes pnpm@10.18.3 --filter @fliptrybe/api start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://fliptrybe-ads-campaigner-web-g25g.onrender.com
      - key: ADMIN_URL
        value: https://fliptrybe-ads-campaigner-admin.onrender.com
      - key: API_URL
        value: https://ft-campaigner-api-fra.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: fliptrybe-ads-campaigner-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fliptrybe-ads-campaigner-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: fliptrybe-ads-campaigner
      - key: CLOUDINARY_SECURE_DISTRIBUTION
        sync: false
      - key: ADS_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: live
      - key: SMM_PROVIDER
        value: live
      - key: SMDPANEL_API_URL
        value: https://smdpanel.com/api/v2
      - key: SMDPANEL_ENDPOINT
        value: https://smdpanel.com/api/v2
      - key: SMDPANEL_API_KEY
        sync: false
      - key: SMDPANEL_CURRENCY
        value: USD
      - key: SMDPANEL_SERVICE_MAP
        sync: false
      - key: SMMRAJA_API_URL
        value: https://www.smmraja.com/api/v3
      - key: SMMRAJA_API_KEY
        sync: false
      - key: SMMRAJA_CURRENCY
        value: USD
      - key: SMMRAJA_SERVICE_MAP
        sync: false
      - key: JAP_API_URL
        value: https://justanotherpanel.com/api/v2
      - key: JAP_API_KEY
        sync: false
      - key: JAP_CURRENCY
        value: USD
      - key: JAP_SERVICE_MAP
        sync: false
      - key: PEAKERR_API_URL
        value: https://peakerr.com/api/v2
      - key: PEAKERR_API_KEY
        sync: false
      - key: PEAKERR_CURRENCY
        value: USD
      - key: PEAKERR_SERVICE_MAP
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: AI_BRAIN_ENABLED
        value: "false"
      - key: AI_BRAIN_BASE_URL
        sync: false
      - key: AI_BRAIN_API_KEY
        sync: false
      - key: AI_BRAIN_TIMEOUT_SECONDS
        value: "0.8"
      - key: NOTIFICATION_PROVIDER
        value: mock
      - key: ENABLE_OTP_MODULE
        value: "false"
      - key: ENABLE_PREMIUM_OTP
        value: "false"
      - key: ENABLE_BUDGET_OTP
        value: "false"
      - key: ENABLE_OTP_ADMIN
        value: "false"
      - key: ENABLE_DIGITAL_ACCESS
        value: "false"
      - key: ENABLE_DIGITAL_ACCESS_ADMIN
        value: "false"
      - key: OTP_PROVIDER_MODE
        value: mock
      - key: OTP_BETA_WORKSPACE_IDS
        sync: false
      - key: OTP_USD_TO_NGN_RATE
        value: "1600"
      - key: TEXTVERIFIED_API_URL
        value: https://www.textverified.com/api/pub/v2
      - key: TEXTVERIFIED_API_KEY
        sync: false
      - key: FIVESIM_API_URL
        value: https://5sim.net/v1
      - key: FIVESIM_API_KEY
        sync: false
      - key: SMSMAN_API_URL
        value: https://api.sms-man.com/control
      - key: SMSMAN_API_KEY
        sync: false
      - key: SMSACTIVATE_API_URL
        sync: false
      - key: SMSACTIVATE_API_KEY
        sync: false
      - key: SMSACTIVATE_COMPATIBLE_ENABLED
        value: "false"
      - key: KORAPAY_BASE_URL
        value: https://api.korapay.com
      - key: KORAPAY_PUBLIC_KEY
        sync: false
      - key: KORAPAY_SECRET_KEY
        sync: false
      - key: KORAPAY_ENCRYPTION_KEY
        sync: false
      - key: KORAPAY_WEBHOOK_URL
        value: https://ft-campaigner-api-fra-g25g.onrender.com/api/webhooks/korapay
      - key: KORAPAY_WEBHOOK_SECRET
        sync: false
      - key: KORAPAY_REDIRECT_URL
        value: https://fliptrybe-ads-campaigner-web-g25g.onrender.com
      - key: TREASURY_BANK_NAME
        sync: false
      - key: TREASURY_ACCOUNT_NAME
        sync: false
      - key: TREASURY_ACCOUNT_NUMBER
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false

  - type: web
    runtime: static
    name: fliptrybe-ads-campaigner-web
    rootDir: .
    autoDeployTrigger: commit
    buildCommand: npx --yes pnpm@10.18.3 install --frozen-lockfile --prod=false && npx --yes pnpm@10.18.3 --filter @fliptrybe/web build
    staticPublishPath: apps/web/out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_PUBLIC_API_URL
        value: https://ft-campaigner-api-fra.onrender.com
      - key: NEXT_PUBLIC_ENABLE_DIGITAL_ACCESS
        value: "false"

  - type: web
    runtime: static
    name: fliptrybe-ads-campaigner-admin
    rootDir: .
    autoDeployTrigger: commit
    buildCommand: npx --yes pnpm@10.18.3 install --frozen-lockfile --prod=false && npx --yes pnpm@10.18.3 --filter @fliptrybe/admin build
    staticPublishPath: apps/admin/out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_PUBLIC_API_URL
        value: https://ft-campaigner-api-fra.onrender.com
      - key: NEXT_PUBLIC_ENABLE_DIGITAL_ACCESS_ADMIN
        value: "false"

  - type: worker
    runtime: node
    name: fliptrybe-ads-campaigner-worker
    region: frankfurt
    plan: starter
    rootDir: .
    autoDeployTrigger: commit
    buildCommand: npx --yes pnpm@10.18.3 install --frozen-lockfile --prod=false && npx --yes pnpm@10.18.3 prisma:generate && npx --yes pnpm@10.18.3 --filter @fliptrybe/worker build
    startCommand: npx --yes pnpm@10.18.3 --filter @fliptrybe/worker start
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fliptrybe-ads-campaigner-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fliptrybe-ads-campaigner-redis
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: 5
      - key: ADS_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: live
      - key: SMM_PROVIDER
        value: live
      - key: SMDPANEL_API_URL
        value: https://smdpanel.com/api/v2
      - key: SMDPANEL_ENDPOINT
        value: https://smdpanel.com/api/v2
      - key: SMDPANEL_API_KEY
        sync: false
      - key: SMDPANEL_CURRENCY
        value: USD
      - key: SMDPANEL_SERVICE_MAP
        sync: false
      - key: SMMRAJA_API_URL
        value: https://www.smmraja.com/api/v3
      - key: SMMRAJA_API_KEY
        sync: false
      - key: SMMRAJA_CURRENCY
        value: USD
      - key: SMMRAJA_SERVICE_MAP
        sync: false
      - key: JAP_API_URL
        value: https://justanotherpanel.com/api/v2
      - key: JAP_API_KEY
        sync: false
      - key: JAP_CURRENCY
        value: USD
      - key: JAP_SERVICE_MAP
        sync: false
      - key: PEAKERR_API_URL
        value: https://peakerr.com/api/v2
      - key: PEAKERR_API_KEY
        sync: false
      - key: PEAKERR_CURRENCY
        value: USD
      - key: PEAKERR_SERVICE_MAP
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: NOTIFICATION_PROVIDER
        value: mock
      - key: ENABLE_OTP_MODULE
        value: "false"
      - key: ENABLE_PREMIUM_OTP
        value: "false"
      - key: ENABLE_BUDGET_OTP
        value: "false"
      - key: ENABLE_OTP_ADMIN
        value: "false"
      - key: ENABLE_DIGITAL_ACCESS
        value: "false"
      - key: ENABLE_DIGITAL_ACCESS_ADMIN
        value: "false"
      - key: OTP_PROVIDER_MODE
        value: mock
      - key: OTP_BETA_WORKSPACE_IDS
        sync: false
      - key: OTP_USD_TO_NGN_RATE
        value: "1600"
      - key: TEXTVERIFIED_API_URL
        value: https://www.textverified.com/api/pub/v2
      - key: TEXTVERIFIED_API_KEY
        sync: false
      - key: FIVESIM_API_URL
        value: https://5sim.net/v1
      - key: FIVESIM_API_KEY
        sync: false
      - key: SMSMAN_API_URL
        value: https://api.sms-man.com/control
      - key: SMSMAN_API_KEY
        sync: false
      - key: SMSACTIVATE_API_URL
        sync: false
      - key: SMSACTIVATE_API_KEY
        sync: false
      - key: SMSACTIVATE_COMPATIBLE_ENABLED
        value: "false"
      - key: KORAPAY_BASE_URL
        value: https://api.korapay.com
      - key: KORAPAY_PUBLIC_KEY
        sync: false
      - key: KORAPAY_SECRET_KEY
        sync: false
      - key: KORAPAY_ENCRYPTION_KEY
        sync: false
      - key: KORAPAY_WEBHOOK_URL
        value: https://ft-campaigner-api-fra-g25g.onrender.com/api/webhooks/korapay
      - key: KORAPAY_WEBHOOK_SECRET
        sync: false
      - key: KORAPAY_REDIRECT_URL
        value: https://fliptrybe-ads-campaigner-web-g25g.onrender.com
      - key: TREASURY_BANK_NAME
        sync: false
      - key: TREASURY_ACCOUNT_NAME
        sync: false
      - key: TREASURY_ACCOUNT_NUMBER
        sync: false

  - type: keyvalue
    name: fliptrybe-ads-campaigner-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: fliptrybe-ads-campaigner-postgres
    region: frankfurt
    plan: basic-256mb
    databaseName: fliptrybe_ads
    user: fliptrybe
    postgresMajorVersion: "18"
