services:
  - type: web
    runtime: node
    name: ft-campaigner-api-fra
    region: frankfurt
    plan: starter
    rootDir: .
    autoDeployTrigger: commit
    healthCheckPath: /v1/health
    buildCommand: npx --yes pnpm@10.18.3 install --frozen-lockfile --prod=false && npx --yes pnpm@10.18.3 --filter @fliptrybe/database prisma generate && npx --yes pnpm@10.18.3 --filter @fliptrybe/api build
    preDeployCommand: >-
      npx --yes pnpm@10.18.3 --filter @fliptrybe/database prisma migrate deploy &&
      npx --yes pnpm@10.18.3 --filter @fliptrybe/database seed:digital-access &&
      npx --yes pnpm@10.18.3 --filter @fliptrybe/database seed:vtu &&
      npx --yes pnpm@10.18.3 --filter @fliptrybe/database seed:virtual-numbers &&
      npx --yes pnpm@10.18.3 --filter @fliptrybe/database seed:financial-products &&
      npx --yes pnpm@10.18.3 --filter @fliptrybe/database seed:provider-capability-grants &&
      npx --yes pnpm@10.18.3 --filter @fliptrybe/database seed:marketplace
    startCommand: npx --yes pnpm@10.18.3 --filter @fliptrybe/api start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://fliptrybe.xyz
      - key: ADMIN_URL
        value: https://fliptrybe-ads-campaigner-admin-umys.onrender.com
      - key: API_URL
        value: https://ft-campaigner-api-fra.onrender.com
      - key: PUBLIC_APP_URL
        value: https://fliptrybe.xyz
      - key: FRONTEND_URLS
        value: https://www.fliptrybe.xyz,https://fliptrybe.xyz,https://fliptrybe-ads-campaigner-web-g24r.onrender.com,https://fliptrybe-ads-campaigner-admin-umys.onrender.com
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: PRISMA_MIGRATE_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fliptrybe-ads-campaigner-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PLATFORM_ADMIN_USERNAMES
        sync: false
      - key: TOTP_SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: VOUCHER_PIN_SECRET
        generateValue: true
      - key: ALLOW_MOCK_PROVIDERS
        value: "false"
      - key: AUTH_SESSION_TTL_SECONDS
        value: "604800"
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: QUEUE_PRODUCER_ENABLED
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: CLOUDINARY_IMAGE_UPLOAD_PRESET
        sync: false
      - key: CLOUDINARY_VIDEO_UPLOAD_PRESET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: fliptrybe-ads-campaigner
      - key: CLOUDINARY_SECURE_DISTRIBUTION
        sync: false
      - key: MEDIA_UPLOAD_SIGNATURE_TTL_SECONDS
        value: "900"
      - key: MEDIA_UPLOAD_ALLOW_MOCK_STORAGE
        value: "false"
      - key: MEDIA_MAX_IMAGE_BYTES
        value: "10485760"
      - key: MEDIA_MAX_VIDEO_BYTES
        value: "314572800"
      - key: MEDIA_MAX_SCREENSHOT_BYTES
        value: "5242880"
      - key: ADS_PROVIDER
        value: live
      - key: PAYMENT_PROVIDER
        value: live
      - key: SMM_PROVIDER
        value: live
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: ANTHROPIC_TIMEOUT_SECONDS
        value: "20"
      - key: ANTHROPIC_MAX_RETRIES
        value: "2"
      - key: AI_BRAIN_ENABLED
        value: "true"
      - key: AI_BRAIN_BASE_URL
        sync: false
      - key: AI_BRAIN_API_KEY
        sync: false
      - key: AI_BRAIN_TIMEOUT_SECONDS
        value: "0.8"
      - key: NOTIFICATION_PROVIDER
        value: live
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Production safety defaults: staged OTP and automation remain off until explicitly rolled out.
      - key: ENABLE_OTP_MODULE
        value: "false"
      - key: ENABLE_PREMIUM_OTP
        value: "false"
      - key: ENABLE_BUDGET_OTP
        value: "false"
      - key: ENABLE_OTP_ADMIN
        value: "false"
      - key: ENABLE_DIGITAL_ACCESS
        value: "true"
      - key: ENABLE_DIGITAL_ACCESS_ADMIN
        value: "true"
      - key: TRUST_PROXY_AUTH_HEADERS
        value: "false"
      - key: DIGITAL_ACCESS_TRUST_AUTH_HEADERS
        value: "false"
      - key: DIGITAL_ACCESS_WORKER_ENABLED
        value: "false"
      - key: DIGITAL_ACCESS_AUTOMATION_WORKER_ENABLED
        value: "false"
      - key: OTP_PROVIDER_HEALTH_WORKER_ENABLED
        value: "false"
      - key: OTP_PROVIDER_MODE
        value: mock
      - key: OTP_BETA_WORKSPACE_IDS
        sync: false
      - key: SMSACTIVATE_COMPATIBLE_ENABLED
        value: "false"
      - key: FX_LIVE_PROVIDER_REFRESH
        value: "false"
      - key: KORAPAY_BASE_URL
        value: https://api.korapay.com
      - key: KORAPAY_PUBLIC_KEY
        sync: false
      - key: KORAPAY_SECRET_KEY
        sync: false
      - key: KORAPAY_ENCRYPTION_KEY
        sync: false
      - key: KORAPAY_WEBHOOK_URL
        value: https://ft-campaigner-api-fra.onrender.com/api/webhooks/korapay
      - key: KORAPAY_WEBHOOK_SECRET
        sync: false
      - key: KORAPAY_REDIRECT_URL
        value: https://fliptrybe.xyz
      - key: TREASURY_BANK_NAME
        sync: false
      - key: TREASURY_ACCOUNT_NAME
        sync: false
      - key: TREASURY_ACCOUNT_NUMBER
        sync: false
      - key: FEATURE_VTU
        value: "true"
      - key: FEATURE_BILLS_ELECTRICITY
        value: "true"
      - key: FEATURE_BILLS_CABLE
        value: "true"
      - key: FEATURE_BILLS_BETTING
        value: "true"
      - key: FEATURE_BILLS_EDUCATION
        value: "true"
      - key: FEATURE_TELECOM_GATEWAY
        value: "true"
      - key: FEATURE_GUEST_CHECKOUT
        value: "true"
      - key: FEATURE_VIRTUAL_ACCOUNTS
        sync: false
      - key: FEATURE_VIRTUAL_CARDS
        value: "false"
      - key: FINANCIAL_PROVIDER_SIGNOFF
        value: "false"
      - key: FEATURE_REMITTANCE
        sync: false
      - key: FEATURE_WALLET_WITHDRAWALS
        sync: false
      - key: FEATURE_KYC_VERIFICATION
        sync: false
      - key: FEATURE_KYB_VERIFICATION
        sync: false
      - key: FEATURE_LIVE_PROVIDER_INTEGRATIONS
        sync: false
      - key: CLUBKONNECT_BASE_URL
        value: https://www.nellobytesystems.com
      - key: CLUBKONNECT_USER_ID
        sync: false
      - key: CLUBKONNECT_API_KEY
        sync: false
      - key: EBILLS_BASE_URL
        value: https://ebill.com.ng/api
      - key: EBILLS_API_KEY
        sync: false
      - key: SWIFTLINK_BASE_URL
        sync: false
      - key: SWIFTLINK_API_KEY
        sync: false
      - key: SWIFTLINK_EMAIL
        sync: false
      - key: SWIFTLINK_PASSWORD
        sync: false
      - key: SIRPDATA_BASE_URL
        sync: false
      - key: SIRPDATA_API_KEY
        sync: false
      - key: IACAFE_BASE_URL
        sync: false
      - key: IACAFE_API_KEY
        sync: false
      - key: TOPUPWIZARD_BASE_URL
        sync: false
      - key: TOPUPWIZARD_API_KEY
        sync: false
      - key: RELOADLY_AUTH_URL
        value: https://auth.reloadly.com/oauth/token
      - key: RELOADLY_BASE_URL
        value: https://topups.reloadly.com
      - key: RELOADLY_CLIENT_ID
        sync: false
      - key: RELOADLY_CLIENT_SECRET
        sync: false
      - key: RELOADLY_GIFTCARDS_BASE_URL
        value: https://giftcards.reloadly.com
      - key: RELOADLY_SANDBOX
        value: "false"
      - key: SOGO_API_KEY
        sync: false
      - key: SOGO_BASE_URL
        value: https://api.sogo.africa/v1
      - key: SOGO_SANDBOX
        value: "false"
      - key: SOGO_WEBHOOK_SECRET
        sync: false
      - key: SWAPPR_BASE_URL
        sync: false
      - key: SWAPPR_API_KEY
        sync: false
      - key: SWAPPR_SECRET_KEY
        sync: false
      - key: SWAPPR_WEBHOOK_SECRET
        sync: false
      - key: PAYSCRIBE_BASE_URL
        sync: false
      - key: PAYSCRIBE_API_KEY
        sync: false
      - key: PAYSCRIBE_WEBHOOK_SECRET
        sync: false
      - key: YATIVO_BASE_URL
        sync: false
      - key: YATIVO_API_KEY
        sync: false
      - key: YATIVO_ACCOUNT_ID
        sync: false
      - key: FINCRA_API_KEY
        sync: false
      - key: FINCRA_BUSINESS_ID
        sync: false
      - key: FINCRA_WEBHOOK_ENCRYPTION_KEY
        sync: false
      - key: FINCRA_ENV
        value: production

  - type: web
    runtime: node
    name: fliptrybe-ads-campaigner-web
    region: frankfurt
    plan: starter
    rootDir: .
    autoDeployTrigger: commit
    buildCommand: npx --yes pnpm@10.18.3 install --frozen-lockfile --prod=false && npx --yes pnpm@10.18.3 --filter @fliptrybe/web build
    startCommand: npx --yes pnpm@10.18.3 --filter @fliptrybe/web start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://fliptrybe.xyz
      - key: NEXT_PUBLIC_API_URL
        value: https://ft-campaigner-api-fra.onrender.com
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://ft-campaigner-api-fra.onrender.com
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://fliptrybe-ads-campaigner-admin-umys.onrender.com
      - key: NEXT_PUBLIC_ENABLE_DIGITAL_ACCESS
        value: "true"
      - key: NEXT_PUBLIC_ENABLE_GROWTH_SERVICES
        value: "true"
      - key: NEXT_PUBLIC_SHOW_DATA_SOURCE_BADGE
        value: "false"

  - type: static
    runtime: static
    name: fliptrybe-ads-campaigner-admin
    rootDir: .
    autoDeployTrigger: commit
    buildCommand: npx --yes pnpm@10.18.3 install --frozen-lockfile --prod=false && npx --yes pnpm@10.18.3 --filter @fliptrybe/admin build
    staticPublishPath: apps/admin/out
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_PUBLIC_API_URL
        value: https://ft-campaigner-api-fra.onrender.com
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://ft-campaigner-api-fra.onrender.com
      - key: NEXT_PUBLIC_ENABLE_DIGITAL_ACCESS_ADMIN
        value: "true"
      - key: NEXT_PUBLIC_ENABLE_GROWTH_SERVICES_ADMIN
        value: "true"
      - key: NEXT_PUBLIC_ENABLE_CAMPAIGN_OPS_ADMIN
        value: "true"
      - key: NEXT_PUBLIC_SHOW_DATA_SOURCE_BADGE
        value: "false"

  - type: worker
    runtime: node
    name: fliptrybe-ads-campaigner-worker
    region: frankfurt
    plan: starter
    rootDir: .
    autoDeployTrigger: commit
    buildCommand: npx --yes pnpm@10.18.3 install --frozen-lockfile --prod=false && npx --yes pnpm@10.18.3 --filter @fliptrybe/database prisma generate && npx --yes pnpm@10.18.3 --filter @fliptrybe/worker build
    startCommand: npx --yes pnpm@10.18.3 --filter @fliptrybe/worker start
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fliptrybe-ads-campaigner-redis
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: 5
      - key: ADS_PROVIDER
        value: live
      - key: PAYMENT_PROVIDER
        value: live
      - key: SMM_PROVIDER
        value: live
      - key: ALLOW_MOCK_PROVIDERS
        value: "false"
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: NOTIFICATION_PROVIDER
        value: live
      - key: ENABLE_OTP_MODULE
        value: "false"
      - key: ENABLE_PREMIUM_OTP
        value: "false"
      - key: ENABLE_BUDGET_OTP
        value: "false"
      - key: ENABLE_OTP_ADMIN
        value: "false"
      - key: DIGITAL_ACCESS_WORKER_ENABLED
        value: "false"
      - key: DIGITAL_ACCESS_AUTOMATION_WORKER_ENABLED
        value: "false"
      - key: OTP_PROVIDER_HEALTH_WORKER_ENABLED
        value: "false"
      - key: OTP_PROVIDER_MODE
        value: mock
      - key: SMSACTIVATE_COMPATIBLE_ENABLED
        value: "false"
      - key: FEATURE_VTU
        value: "true"
      - key: FEATURE_BILLS_ELECTRICITY
        value: "true"
      - key: FEATURE_BILLS_CABLE
        value: "true"
      - key: FEATURE_BILLS_BETTING
        value: "true"
      - key: FEATURE_BILLS_EDUCATION
        value: "true"
      - key: FEATURE_TELECOM_GATEWAY
        value: "true"
      - key: FEATURE_GUEST_CHECKOUT
        value: "true"
      - key: FEATURE_VIRTUAL_ACCOUNTS
        sync: false
      - key: FEATURE_VIRTUAL_CARDS
        value: "false"
      - key: FINANCIAL_PROVIDER_SIGNOFF
        value: "false"
      - key: FEATURE_REMITTANCE
        sync: false
      - key: FEATURE_WALLET_WITHDRAWALS
        sync: false
      - key: FEATURE_KYC_VERIFICATION
        sync: false
      - key: FEATURE_KYB_VERIFICATION
        sync: false
      - key: FEATURE_LIVE_PROVIDER_INTEGRATIONS
        sync: false
      - key: CLUBKONNECT_BASE_URL
        value: https://www.nellobytesystems.com
      - key: CLUBKONNECT_USER_ID
        sync: false
      - key: CLUBKONNECT_API_KEY
        sync: false
      - key: PAYSCRIBE_BASE_URL
        sync: false
      - key: PAYSCRIBE_API_KEY
        sync: false
      - key: PAYSCRIBE_WEBHOOK_SECRET
        sync: false
      - key: SMDPANEL_API_KEY
        sync: false
      - key: SMMRAJA_API_KEY
        sync: false
      - key: JAP_API_KEY
        sync: false
      - key: PEAKERR_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: keyvalue
    name: fliptrybe-ads-campaigner-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []
