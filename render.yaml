      - key: JAP_API_URL
        value: https://justanotherpanel.com/api/v2
      - key: JAP_API_KEY
        sync: false
      - key: JAP_CURRENCY
        value: USD
      - key: JAP_SERVICE_MAP
        sync: false
      - key: PEAKERR_API_URL
        value: https://peakerr.com/api/v2
      - key: PEAKERR_API_KEY
        sync: false
      - key: PEAKERR_CURRENCY
        value: USD
      - key: PEAKERR_SERVICE_MAP
        sync: false
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: ANTHROPIC_TIMEOUT_SECONDS
        value: "20"
      - key: ANTHROPIC_MAX_RETRIES
        value: "2"
      - key: AI_BRAIN_ENABLED
