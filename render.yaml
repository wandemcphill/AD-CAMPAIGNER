        value: "false"
      - key: MEDIA_MAX_IMAGE_BYTES
        value: "10485760"
      - key: MEDIA_MAX_VIDEO_BYTES
        value: "314572800"
      - key: MEDIA_MAX_SCREENSHOT_BYTES
        value: "5242880"
      - key: TOTP_SECRET_ENCRYPTION_KEY
        sync: false
      - key: VOUCHER_PIN_SECRET
        sync: false
      - key: ALLOW_MOCK_PROVIDERS
