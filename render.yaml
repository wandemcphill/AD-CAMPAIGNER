      # ── SOGO live financial key material ───────────────────────────────
      # The RMB API requires a Sogo SECRET key with rmb:read + rmb:write.
      # Keep SOGO_API_KEY for existing gift-card integrations; use the dedicated
      # secret below for RMB when one has been provisioned in the Sogo dashboard.
      - key: SOGO_SECRET_KEY
        sync: false
      - key: SOGO_API_KEY
        sync: false
      - key: SOGO_BASE_URL
        value: https://api.sogo.africa/v1
      - key: SOGO_SANDBOX
        value: "false"
