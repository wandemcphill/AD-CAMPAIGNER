name: fliptrybe-ads-campaigner

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fliptrybe_ads
      POSTGRES_USER: fliptrybe
      POSTGRES_PASSWORD: fliptrybe
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fliptrybe -d fliptrybe_ads"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file:
      - ../../.env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        APP_NAME: web
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        APP_NAME: admin
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
