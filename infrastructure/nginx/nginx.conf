events {}

http {
  upstream fliptrybe_web {
    server web:3000;
  }

  upstream fliptrybe_admin {
    server admin:3000;
  }

  upstream fliptrybe_api {
    server api:4000;
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://fliptrybe_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
      proxy_pass http://fliptrybe_admin/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://fliptrybe_web/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
