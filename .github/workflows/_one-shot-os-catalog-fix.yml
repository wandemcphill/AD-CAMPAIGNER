# Temporary runner is also registered on main so pushes to this repair branch execute it.
name: One-shot OS and catalog repair

on:
  push:
    branches:
      - fix/os-runtime-and-catalog-sync
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p = Path(path); text = p.read_text(); count = text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected 1 occurrence, found {count}')
              p.write_text(text.replace(old, new, 1))
          def replace_all(path, old, new, expected):
              p = Path(path); text = p.read_text(); count = text.count(old)
              if count != expected: raise SystemExit(f'{path}: expected {expected} occurrences, found {count}')
              p.write_text(text.replace(old, new))
          replace_all('apps/web/app/os/shell.tsx', 'section.children.length > 0', '(section.children?.length ?? 0) > 0', 2)
          replace_all('apps/web/app/os/shell.tsx', 'section.children.map((child) => (', 'section.children?.map((child) => (', 2)
          replace_once('apps/api/src/modules/guest-checkout/guest-checkout.service.ts', 'const GUEST_CATALOG_PROVIDER = "clubkonnect";', 'const GUEST_DATA_CATALOG_PROVIDER = "gsubz";\nconst GUEST_CABLE_CATALOG_PROVIDER = "clubkonnect";')
          replace_once('apps/api/src/modules/guest-checkout/guest-checkout.service.ts', 'providerName: GUEST_CATALOG_PROVIDER,\n        ...(network ? { network } : {})', 'providerName: GUEST_DATA_CATALOG_PROVIDER,\n        ...(network ? { network } : {})')
          replace_once('apps/api/src/modules/guest-checkout/guest-checkout.service.ts', 'providerName: GUEST_CATALOG_PROVIDER,\n        ...(provider ? { cableProvider: provider } : {})', 'providerName: GUEST_CABLE_CATALOG_PROVIDER,\n        ...(provider ? { cableProvider: provider } : {})')
          replace_once('apps/worker/src/main.ts', '  for (const providerName of VTU_LIVE_PROVIDERS) {\n    await queue.upsertJobScheduler(', '  // Warm production catalogs immediately after deploy/startup.\n  for (const providerName of VTU_DATA_CATALOG_PROVIDERS) {\n    await queue.add("plan_catalog_sync", { name: "plan_catalog_sync", providerName }, { jobId: `vtu-plan-sync-warmup-${providerName}`, removeOnComplete: true, removeOnFail: 100 });\n  }\n  for (const providerName of VTU_CABLE_CATALOG_PROVIDERS) {\n    await queue.add("cable_catalog_sync", { name: "cable_catalog_sync", providerName }, { jobId: `vtu-cable-sync-warmup-${providerName}`, removeOnComplete: true, removeOnFail: 100 });\n  }\n\n  for (const providerName of VTU_LIVE_PROVIDERS) {\n    await queue.upsertJobScheduler(')
          replace_once('apps/worker/src/vtu-processor.ts', '  const adapter = buildAdapter(providerName);\n  const offers = await adapter.listDataPlans();\n\n  const seenPlanIds', '  const adapter = buildAdapter(providerName);\n  const offers = await adapter.listDataPlans();\n  if (offers.length === 0) throw new Error(`Catalog sync refused: ${providerName} returned an empty DATA catalog; existing rows were preserved`);\n\n  const seenPlanIds')
          replace_once('apps/worker/src/vtu-processor.ts', '  const offers = await adapter.listCablePackages();\n  const seenCodes', '  const offers = await adapter.listCablePackages();\n  if (offers.length === 0) throw new Error(`Catalog sync refused: ${providerName} returned an empty CABLE catalog; existing rows were preserved`);\n  const seenCodes')
          replace_once('render.yaml', '      - key: TOPUPWIZARD_API_KEY\n        sync: false\n      - key: VTUGATE_BASE_URL', '      - key: TOPUPWIZARD_API_KEY\n        sync: false\n      - key: GSUBZ_BASE_URL\n        value: https://api.gsubz.com/api\n      - key: GSUBZ_API_KEY\n        sync: false\n      - key: VTUGATE_BASE_URL')
          replace_once('render.yaml', '      - key: SIRPDATA_BASE_URL\n        sync: false\n      - key: IACAFE_BASE_URL', '      - key: SIRPDATA_BASE_URL\n        sync: false\n      - key: GSUBZ_BASE_URL\n        value: https://api.gsubz.com/api\n      - key: GSUBZ_API_KEY\n        sync: false\n      - key: IACAFE_BASE_URL')
          print('Repairs applied successfully')
          PY
      - name: Commit repaired branch
        shell: bash
        run: |
          rm -f .github/workflows/_one-shot-os-catalog-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/os/shell.tsx apps/api/src/modules/guest-checkout/guest-checkout.service.ts apps/worker/src/main.ts apps/worker/src/vtu-processor.ts render.yaml .github/workflows/_one-shot-os-catalog-fix.yml
          git commit -m "fix: recover OS runtime and repair VTU catalog sync"
          git push origin HEAD:fix/os-runtime-and-catalog-sync
